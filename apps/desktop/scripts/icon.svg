<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#2c6fdb"/>
      <stop offset="1" stop-color="#1e50ad"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded-rect app tile with a slight top sheen -->
  <rect x="96" y="96" width="832" height="832" rx="196" fill="url(#bg)"/>
  <rect x="96" y="96" width="832" height="832" rx="196" fill="url(#sheen)"/>

  <!-- knowledge graph: a hub linking notes + an agent node -->
  <g stroke="#ffffff" stroke-width="26" stroke-linecap="round" opacity="0.92">
    <line x1="512" y1="512" x2="512" y2="316"/>
    <line x1="512" y1="512" x2="690" y2="612"/>
    <line x1="512" y1="512" x2="334" y2="612"/>
  </g>
  <g fill="#ffffff">
    <circle cx="512" cy="512" r="78"/>
    <circle cx="512" cy="316" r="52"/>
    <circle cx="690" cy="612" r="52"/>
  </g>
  <!-- accent node (the agent) -->
  <circle cx="334" cy="612" r="52" fill="#bcd6ff"/>
</svg>
