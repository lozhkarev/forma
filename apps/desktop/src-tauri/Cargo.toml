[package]
name = "forma-desktop"
version = "0.1.0"
description = "Forma — local-first AI workspace"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "forma_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["apple-native"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
